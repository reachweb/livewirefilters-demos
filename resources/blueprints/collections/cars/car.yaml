tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: Title
          -
            handle: car_category
            field:
              type: terms
              taxonomies:
                - car_category
              display: 'Car category'
              mode: select
          -
            handle: car_brand
            field:
              type: terms
              taxonomies:
                - car_brand
              display: 'Car brand'
              mode: select
              max_items: 1
          -
            handle: car_model
            field:
              options:
                a3: 'A3'
                q3: 'Q3'
                x1: 'X1'
                c3: 'C3'
                c4-grand-picasso: 'C4 Grand Picasso'
                spacetourer: 'SpaceTourer'
                duster: 'Duster'
                jogger: 'Jogger'
                sandero: 'Sandero'
                '500': '500'
                panda: 'Panda'
                tipo: 'Tipo'
                fiesta: 'Fiesta'
                focus: 'Focus'
                puma: 'Puma'
                i10: 'i10'
                i20: 'i20'
                i30: 'i30'
                tucson: 'Tucson'
                hummer-h3: 'Hummer H3'
                wrangler: 'Wrangler'
                picanto: 'Picanto'
                stonic: 'Stonic'
                mx-5: 'MX-5'
                a-class: 'A-Class'
                vito: 'Vito'
                cooper: 'Cooper'
                micra: 'Micra'
                nv200: 'NV200'
                qashqai: 'Qashqai'
                '208': '208'
                '2008': '2008'
                rifter: 'Rifter'
                captur: 'Captur'
                clio: 'Clio'
                fabia: 'Fabia'
                kamiq: 'Kamiq'
                octavia: 'Octavia'
                scala: 'Scala'
                jimny: 'Jimny'
                swift: 'Swift'
                auris: 'Auris'
                aygo: 'Aygo'
                aygo-x: 'Aygo X'
                c-hr: 'C-HR'
                corolla: 'Corolla'
                rav4: 'RAV4'
                yaris: 'Yaris'
                yaris-cross: 'Yaris Cross'
                v60: 'V60'
                xc40: 'XC40'
                caddy: 'Caddy'
                golf: 'Golf'
                polo: 'Polo'
                t-cross: 'T-Cross'
                t-roc: 'T-Roc'
                transporter: 'Transporter'
                up: 'Up'
              max_items: 1
              type: select
              display: 'Car model'
          -
            handle: transmission
            field:
              options:
                manualTransmission: Manual
                automaticTransmission: Automatic
              max_items: 1
              type: select
              display: Transmission
              width: 50
          -
            handle: date_of_registration
            field:
              earliest_date: '2020-01-01'
              type: date
              display: 'Date of registration'
              width: 50
          -
            handle: fuel_type
            field:
              options:
                superUnl: Unleaded
                diesel: Diesel
              max_items: 1
              type: select
              display: 'Fuel type'
              width: 50
          -
            handle: air_condition
            field:
              options:
                airCondition: 'Air condition'
                clima: Clima
              type: radio
              display: 'Air condition'
              width: 50
          -
            handle: doors
            field:
              type: integer
              display: Doors
              width: 50
          -
            handle: seats
            field:
              type: integer
              display: Seats
              width: 50
          -
            handle: special_categories
            field:
              options:
                four-wheel-drive: 4x4
                cabrio: Cabrio
                crossover-suv: 'Crossover / SUV'
                luxury: Luxury
                van: Van
                mini-bus: 'Mini Bus'
              type: checkboxes
              display: 'Special categories'
          -
            handle: image
            field:
              max_files: 1
              container: assets
              type: assets
              display: Image
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: price
            field:
              type: text
              display: Price
title: Car
